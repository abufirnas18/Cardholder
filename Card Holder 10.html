<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card Holder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--ink:#111;--bg:#f4f4f6;--glass:rgba(255,255,255,.66);--line:rgba(0,0,0,.08);--c:#ff0000;--frame:#cfd2d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f5f5f7;--bg:#0e0e10;--glass:rgba(44,44,48,.62);--line:rgba(255,255,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f5f5f7;--bg:#0e0e10;--glass:rgba(44,44,48,.62);--line:rgba(255,255,255,.12);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden}
#stage{position:absolute;inset:0;perspective:1100px;display:grid;place-items:center;touch-action:none}
.sh{position:absolute;left:50%;top:50%;width:210px;height:30px;margin:150px 0 0 -105px;background:radial-gradient(ellipse,rgba(0,0,0,.3),transparent 70%);filter:blur(6px)}
#cnt{position:absolute;left:0;right:0;top:50%;margin-top:176px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
#w{position:relative;width:var(--W);height:var(--H);transform-style:preserve-3d;will-change:transform}
.back,.front,.flap{position:absolute;border-radius:22px;overflow:visible;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.1),inset 0 2px 3px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.26),0 0 0 1px rgba(0,0,0,.18),0 18px 30px -14px rgba(0,0,0,.5)}
.back{inset:0}.front{left:0;right:0;bottom:0;top:var(--ft);transform:translateZ(14px)}.flap{inset:0;transform-origin:left center;transform:translateZ(16px);display:none}
#w.s-bifold .front,#w.s-flip .front,#w.s-zipper .front{display:none}#w.s-bifold .flap,#w.s-flip .flap,#w.s-zipper .flap{display:block}#w.s-flip .flap,#w.s-zipper .flap{transform-origin:center top}
.st{position:absolute;inset:8px;border:1.5px dashed var(--thr,rgba(255,255,255,.72));border-radius:16px;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.front::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:9px;border-radius:22px 22px 0 0;background:linear-gradient(rgba(255,255,255,.4),transparent);pointer-events:none}
.em button,.it .ic,.charm span{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
#w.nost .st{display:none}#w.noey .grom{display:none}#w.notg .tag{display:none}
.sheen{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--hx,30%) var(--hy,20%),rgba(255,255,255,.55),transparent 55%);mix-blend-mode:soft-light;pointer-events:none}
.win{position:absolute;right:14px;bottom:22px;width:34%;aspect-ratio:3/4;border-radius:10px;border:5px solid var(--frame);background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 2px 5px rgba(0,0,0,.35)}
.grom{position:absolute;left:18px;top:16px;width:26px;height:26px;border-radius:50%;border:6px solid var(--frame);background:#161616;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.ini{position:absolute;left:20px;bottom:22px;font:700 22px/1 ui-serif,Georgia,serif;letter-spacing:.08em;color:rgba(0,0,0,.34);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.pl{position:absolute;left:0;right:0;height:2px;background:rgba(0,0,0,.28);box-shadow:0 1px 0 rgba(255,255,255,.3);display:none}
#w.s-accordion .pl{display:block}
.charm{position:absolute;left:-34px;top:20px;width:56px;height:210px;transform-origin:30px 0;transform:translateZ(18px) rotate(var(--sw,0deg));pointer-events:none}
.charm i{position:absolute;left:27px;top:0;width:5px;height:110px;border-radius:3px;background:var(--c);box-shadow:inset -1px 0 rgba(0,0,0,.3)}
.charm b{position:absolute;left:4px;top:108px;width:52px;height:52px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}.charm b u,.charm b s{position:absolute;display:grid;place-items:center;text-decoration:none}.charm b u{inset:0}.charm b s{inset:4px;background:radial-gradient(circle at 35% 30%,#fff,#dcdcdc);background-size:cover;background-position:center}
.zp{display:none}#w.s-zipper .zp{display:block;position:absolute;left:14px;right:14px;top:62px;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#e4e4e8 0 3px,#6a6a70 3px 6px);box-shadow:0 1px 2px rgba(0,0,0,.45)}.zp b{position:absolute;left:calc(var(--zx,0)*(100% - 28px));top:-8px;width:28px;height:24px;border-radius:9px;background:linear-gradient(#fff,#a9a9b0);box-shadow:0 2px 4px rgba(0,0,0,.45)}

#w.m-pebbled{--tx:var(--t-pebbled)}#w.m-vintage{--tx:var(--t-vintage)}#w.m-herringbone{--tx:var(--t-herringbone)}#w.m-denim{--tx:var(--t-denim)}#w.m-hessian{--tx:var(--t-hessian)}#w.m-velvet{--tx:var(--t-velvet)}#w.m-carbon{--tx:var(--t-carbon)}
#w .mat{background:radial-gradient(120% 80% at 18% 8%,rgba(255,255,255,.22),transparent 60%),radial-gradient(90% 70% at 92% 100%,rgba(0,0,0,.3),transparent 62%),linear-gradient(var(--c),var(--c)),var(--tx) 0 0/460px;background-blend-mode:normal,normal,color,normal}
#w.nat .mat{background:radial-gradient(120% 80% at 18% 8%,rgba(255,255,255,.22),transparent 60%),radial-gradient(90% 70% at 92% 100%,rgba(0,0,0,.3),transparent 62%),var(--tx) 0 0/460px;background-blend-mode:normal}
.it.mt{flex:0 0 94px;opacity:.62;line-height:1.25}.it.mt.s{opacity:1}.ball{display:block;width:78px;height:78px;margin:6px auto 9px;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6),transparent 36%),radial-gradient(circle at 68% 76%,transparent 38%,rgba(0,0,0,.55)),var(--tx) center/190px;box-shadow:0 10px 16px -4px rgba(0,0,0,.45);transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .2s}.it.mt.s .ball{transform:scale(1.12);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink),0 12px 18px -4px rgba(0,0,0,.5)}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs.wrap{flex-wrap:wrap;overflow:visible}
.cp{display:flex;gap:10px;margin:12px 0 8px;height:150px}#sv{position:relative;flex:1;border-radius:14px;touch-action:none;cursor:crosshair;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(var(--h,0),100%,50%))}#hu{position:relative;width:26px;border-radius:13px;touch-action:none;cursor:ns-resize;background:linear-gradient(#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00)}#sv i,#hu i{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55);transform:translate(-50%,-50%);pointer-events:none}#hu i{left:50%}
.fv{position:absolute;right:9px;top:6px;font-style:normal;color:#ffd23f;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.5)}.tabs button{flex:none}.chip{transition:transform .1s ease-out,background .2s}
.gl:focus-visible,.chip:focus-visible,.it:focus-visible,.av:focus-visible,.em button:focus-visible{outline:3px solid #0a84ff;outline-offset:2px}.chip:active,.res:active{transform:scale(.96)}
.em{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.em button{border:0;background:var(--line);border-radius:12px;font-size:24px;padding:8px 0;cursor:pointer;transition:transform .1s,background .2s}.em button:active{transform:scale(.88)}.em button.s{background:var(--ink)}.lb{margin:12px 0 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
@media(prefers-contrast:more){.gl,#sheet,#wm{background:var(--bg);box-shadow:0 0 0 2px var(--ink)}}

async function openScan(){editId=null;closeSheet();if(mode==='open')setOpen(false);sc={step:0,front:null,back:null};$('#scT').textContent='Front of card';$('#scH').textContent='Point at a QR code, or tap the shutter to read the card';$('#scSkip').style.display='none';$('#scan').classList.add('o');$('#bScan').classList.add('on');

function snap(){const v=$('#vid');if(sc.stream&&v.videoWidth){const c=document.createElement('canvas');c.width=Math.min(1280,v.videoWidth);c.height=Math.round(c.width*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.88)}return null}

/* real scanner: QR / vCard first, then the browser text reader, then Tesseract (loaded on demand) */
const JSQR='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const _ls={};function loadScript(u){return _ls[u]||(_ls[u]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>{delete _ls[u];rej(new Error('load'))};document.head.append(s);setTimeout(()=>{delete _ls[u];rej(new Error('timeout'))},15000)}))}
function fromQR(t){t=(t||'').trim();if(!t)return null;const o={name:'',company:'',title:'',phone:'',email:'',web:'',address:''};
 if(/^BEGIN:VCARD/i.test(t)){const g=re=>{const m=t.match(re);return m?m[1].trim():''};o.name=g(/^FN[^:\n]*:(.+)$/im)||g(/^N[^:\n]*:(.+)$/im).split(';').reverse().filter(Boolean).join(' ');o.company=g(/^ORG[^:\n]*:(.+)$/im).replace(/;/g,' ').trim();o.title=g(/^TITLE[^:\n]*:(.+)$/im);o.phone=g(/^TEL[^:\n]*:(.+)$/im);o.email=g(/^EMAIL[^:\n]*:(.+)$/im);o.web=g(/^URL[^:\n]*:(.+)$/im);o.address=g(/^ADR[^:\n]*:(.+)$/im).split(';').filter(Boolean).join(', ');return o}
 if(/^MECARD:/i.test(t)){const u=t.replace(/^MECARD:/i,';'),f=k=>{const m=u.match(new RegExp('(?:^|;)'+k+':([^;]*)','i'));return m?m[1]:''};o.name=f('N').split(',').reverse().join(' ').trim();o.phone=f('TEL');o.email=f('EMAIL');o.web=f('URL');o.company=f('ORG');o.address=f('ADR');return o}
 if(/^https?:\/\//i.test(t)){o.web=t;return o}
 if(/^mailto:/i.test(t)){o.email=t.slice(7).split('?')[0];return o}
 if(/^tel:/i.test(t)){o.phone=t.slice(4);return o}
 return parseCard(t)}
const hasData=o=>!!(o&&(o.name||o.phone||o.email||o.web));
async function readQR(src){try{const im=new Image();im.src=src;await im.decode();
 if('BarcodeDetector' in window){const r=await new window.BarcodeDetector({formats:['qr_code']}).detect(im);if(r[0])return r[0].rawValue}
 await loadScript(JSQR);if(!window.jsQR)return '';const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),q=window.jsQR(d.data,c.width,c.height);return q?q.data:''}catch(e){return ''}}
async function prepOCR(src){try{const im=new Image();im.src=src;await im.decode();const k=Math.min(2,1600/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.35)';x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/png')}catch(e){return src}}
async function tessText(src){try{await loadScript(TESS);if(!window.Tesseract)return '';const w=await window.Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')$('#ocr').textContent='Reading card\u2026 '+Math.round(m.progress*100)+'%'}});
 const r=await Promise.race([w.recognize(await prepOCR(src)),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),60000))]);try{await w.terminate()}catch(e){}return r.data.text}catch(e){return ''}}
async function extract(img){const q=await readQR(img),qo=fromQR(q);if(hasData(qo))return{o:qo,msg:'QR code read \u2014 check the details'};
 let t=await readText(img);if(!(t&&t.trim()))t=await tessText(img);
 if(t&&t.trim()){const o=parseCard(t);if(hasData(o)||o.company)return{o,msg:'Text read from your card \u2014 please check the details'}}
 return{o:null,msg:'Could not read this card here \u2014 fill in the details yourself'}}
function rescale(src,max){return new Promise(res=>{if(!src)return res(src);setTimeout(()=>res(src),4000);const im=new Image();im.onload=()=>{const k=Math.min(1,max/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(src);im.src=src})}
let scanLoop=0;
function stopLive(){clearInterval(scanLoop);scanLoop=0}
function startLive(){stopLive();if(!sc.stream)return;const v=$('#vid'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let busy=0;
 if(!('BarcodeDetector' in window))loadScript(JSQR).catch(()=>{});
 scanLoop=setInterval(async()=>{const sn=$('#scan');if(busy||sc.step!==0||!v.videoWidth||!sn.classList.contains('o')||sn.classList.contains('fo'))return;busy=1;
  try{let raw='';if('BarcodeDetector' in window){const r=await new window.BarcodeDetector({formats:['qr_code']}).detect(v);raw=r[0]?r[0].rawValue:''}
   else if(window.jsQR){const k=Math.min(1,640/v.videoWidth);cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k);cx.drawImage(v,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height),q=window.jsQR(d.data,cv.width,cv.height);raw=q?q.data:''}
   const o=fromQR(raw);if(hasData(o)){sc.step=2;hap();snd('ok');sc.front=snap();sc.pre={o,msg:'QR code read \u2014 check the details'};toReview()}}catch(e){}busy=0},350)}

 if(sc.front)sc.front=await rescale(sc.front,720);if(sc.back)sc.back=await rescale(sc.back,720);paintPh();
